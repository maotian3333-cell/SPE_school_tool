
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morandi Dream Farm｜SVG療癒農場</title>

<style>
:root {
  --sky:#DFE9E5;
  --sage:#A8BAA4;
  --green:#829B80;
  --deep:#687F6E;
  --cream:#F8F1E5;
  --beige:#DDCBB3;
  --brown:#A88870;
  --pink:#D9AFA7;
  --yellow:#E9D49F;
  --ink:#647469;
}

* { box-sizing:border-box; }

body {
  margin:0;
  overflow:hidden;
  background:#E9E7DD;
  font-family:"Noto Sans TC",sans-serif;
}

.farm {
  width:100%;
  height:100vh;
  min-height:600px;
  position:relative;
  overflow:hidden;
  background:linear-gradient(#DFE9E5 0%,#EAE8DC 55%,#A9BD9F 55%);
}

svg {
  overflow:visible;
}

.scene {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

/* 天空 */

.sun {
  transform-box:fill-box;
  transform-origin:center;
  animation:sunPulse 4s ease-in-out infinite;
}

@keyframes sunPulse {
  0%,100% { transform:scale(.95); opacity:.85; }
  50% { transform:scale(1.08); opacity:1; }
}

.cloud {
  animation:cloudTravel 35s linear infinite;
}

.cloud.c2 {
  animation-duration:48s;
  animation-delay:-20s;
}

.cloud.c3 {
  animation-duration:42s;
  animation-delay:-13s;
}

@keyframes cloudTravel {
  from { transform:translateX(-300px); }
  to { transform:translateX(calc(100vw + 400px)); }
}

.bird {
  animation:birdFly 17s linear infinite;
}

.bird.b2 {
  animation-duration:24s;
  animation-delay:-12s;
}

.bird.b3 {
  animation-duration:20s;
  animation-delay:-6s;
}

@keyframes birdFly {
  0% { transform:translate(-100px,0); }
  25% { transform:translate(25vw,-16px); }
  50% { transform:translate(55vw,5px); }
  75% { transform:translate(85vw,-12px); }
  100% { transform:translate(120vw,0); }
}

.bird-wing {
  transform-box:fill-box;
  transform-origin:center;
  animation:wingFlap .35s ease-in-out infinite alternate;
}

@keyframes wingFlap {
  from { transform:rotate(-25deg); }
  to { transform:rotate(25deg); }
}

/* 地景 */

.tree-crown {
  transform-box:fill-box;
  transform-origin:bottom center;
  animation:treeSway 4s ease-in-out infinite;
}

.tree.t2 .tree-crown { animation-delay:-2s; }

@keyframes treeSway {
  0%,100% { transform:rotate(-2deg); }
  50% { transform:rotate(3deg); }
}

/* 風車 */

.blades {
  transform-box:view-box;
  transform-origin:0 0;
  animation:windmill 6s linear infinite;
}

@keyframes windmill {
  to { transform:rotate(360deg); }
}

/* 農夫 */

.farmer-arm {
  transform-box:fill-box;
  transform-origin:top center;
  animation:farmerWave 2s ease-in-out infinite;
}

@keyframes farmerWave {
  0%,100% { transform:rotate(-8deg); }
  50% { transform:rotate(13deg); }
}

.music-note {
  animation:noteFloat 3s ease-out infinite;
}

.music-note.n2 { animation-delay:1s; }
.music-note.n3 { animation-delay:2s; }

@keyframes noteFloat {
  0% { opacity:0; transform:translateY(15px) rotate(-10deg); }
  30% { opacity:1; }
  100% { opacity:0; transform:translateY(-48px) rotate(15deg); }
}

/* 母雞 */

.chicken-walk {
  animation:chickenShift 5s ease-in-out infinite;
}

@keyframes chickenShift {
  0%,100% { transform:translateX(0); }
  50% { transform:translateX(12px); }
}

.chicken-body {
  transform-box:fill-box;
  transform-origin:center bottom;
  animation:chickenBody 1.5s ease-in-out infinite;
}

@keyframes chickenBody {
  0%,100% { transform:rotate(0); }
  50% { transform:rotate(-2deg); }
}

.chicken-neck {
  transform-box:fill-box;
  transform-origin:10% 85%;
  animation:chickenPeck 1.5s ease-in-out infinite;
}

@keyframes chickenPeck {
  0%,35%,100% { transform:rotate(0); }
  53%,75% { transform:rotate(42deg); }
}

.chicken-wing {
  transform-box:fill-box;
  transform-origin:20% 50%;
  animation:wingMove 1.5s ease-in-out infinite;
}

@keyframes wingMove {
  0%,100% { transform:rotate(0); }
  50% { transform:rotate(-8deg); }
}

/* 鴨子 */

.duck-family {
  animation:duckTravel 9s ease-in-out infinite;
}

@keyframes duckTravel {
  0%,100% { transform:translateX(0); }
  50% { transform:translateX(-55px); }
}

.duck-body {
  animation:duckBob .8s ease-in-out infinite;
}

.duck-child:nth-child(2) .duck-body {
  animation-delay:-.2s;
}

.duck-child:nth-child(3) .duck-body {
  animation-delay:-.4s;
}

@keyframes duckBob {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-4px); }
}

.duck-head {
  transform-box:fill-box;
  transform-origin:50% 80%;
  animation:duckHead .9s ease-in-out infinite;
}

@keyframes duckHead {
  0%,100% { transform:rotate(-2deg); }
  50% { transform:rotate(4deg); }
}

.duck-leg {
  transform-box:fill-box;
  transform-origin:50% 0;
  animation:duckStep .45s ease-in-out infinite alternate;
}

.duck-leg.second { animation-delay:-.45s; }

@keyframes duckStep {
  from { transform:rotate(-20deg); }
  to { transform:rotate(20deg); }
}

/* 綿羊 */

.sheep-group {
  animation:sheepGroup 3s ease-in-out infinite;
}

@keyframes sheepGroup {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-3px); }
}

.sheep-one { animation:sheepHop 2.6s ease-in-out infinite; }
.sheep-two { animation:sheepHop 2.6s ease-in-out infinite .8s; }
.sheep-three { animation:sheepHop 2.6s ease-in-out infinite 1.5s; }

@keyframes sheepHop {
  0%,85%,100% { transform:translateY(0); }
  90% { transform:translateY(-7px); }
}

.sheep-eyes {
  animation:blink 4s infinite;
  transform-box:fill-box;
  transform-origin:center;
}

.sheep-two .sheep-eyes { animation-delay:1s; }
.sheep-three .sheep-eyes { animation-delay:2s; }

@keyframes blink {
  0%,45%,49%,100% { transform:scaleY(1); }
  47% { transform:scaleY(.1); }
}

/* 馬 */

.horse-head {
  transform-box:fill-box;
  transform-origin:50% 100%;
  animation:horseLook 3s ease-in-out infinite;
}

@keyframes horseLook {
  0%,100% { transform:rotate(0); }
  50% { transform:rotate(-5deg); }
}

.horse-ear {
  transform-box:fill-box;
  transform-origin:50% 100%;
  animation:horseEar 2s ease-in-out infinite;
}

@keyframes horseEar {
  0%,100% { transform:rotate(0); }
  50% { transform:rotate(12deg); }
}

.horse-eye {
  animation:blink 4.5s infinite;
  transform-box:fill-box;
  transform-origin:center;
}

/* 蝸牛 */

.snail {
  animation:snailTravel 35s linear infinite;
}

@keyframes snailTravel {
  from { transform:translateX(0); }
  to { transform:translateX(75vw); }
}

.snail-body {
  animation:snailWave 2s ease-in-out infinite;
}

@keyframes snailWave {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-2px); }
}

/* 花朵 */

.flower {
  transform-box:fill-box;
  transform-origin:50% 100%;
  animation:flowerSway 2.5s ease-in-out infinite;
}

.flower:nth-child(even) { animation-delay:-1s; }

@keyframes flowerSway {
  0%,100% { transform:rotate(-9deg); }
  50% { transform:rotate(9deg); }
}

/* 標題 */

.title {
  position:absolute;
  top:5%;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  z-index:10;
  color:#788B7D;
  white-space:nowrap;
  pointer-events:none;
}

.title h1 {
  font-family:Georgia,serif;
  font-size:clamp(20px,3vw,36px);
  letter-spacing:5px;
  font-weight:500;
  margin:0;
}

.title p {
  font-size:12px;
  letter-spacing:4px;
  margin-top:8px;
  color:#9A9D8C;
}

@media(max-width:700px) {
  .title { top:3%; }
  .farm { min-height:500px; }
}
</style>
