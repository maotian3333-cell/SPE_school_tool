
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>莫蘭迪色系動畫農場</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dce8e5}
svg{display:block;width:100vw;height:100vh}

/* 天空與雲 */
.cloud{animation:cloudMove 30s ease-in-out infinite alternate}
.cloud.two{animation-delay:-12s}
@keyframes cloudMove{
  from{transform:translateX(-18px)}
  to{transform:translateX(35px)}
}
.sun-glow{transform-box:fill-box;transform-origin:center;animation:sunPulse 4s ease-in-out infinite}
@keyframes sunPulse{0%,100%{opacity:.25;transform:scale(.9)}50%{opacity:.55;transform:scale(1.12)}}
.bird{animation:birdFly 8s ease-in-out infinite alternate}
@keyframes birdFly{from{transform:translate(0,0)}to{transform:translate(35px,-15px)}}

/* 彩虹光暈 */
.rainbow-glow{
  fill:none;stroke:#fff7d9;stroke-width:25;
  opacity:.25;filter:url(#glow);
  animation:rainbowGlow 2.8s ease-in-out infinite;
}
@keyframes rainbowGlow{
  0%,100%{opacity:.18;stroke-width:18}
  50%{opacity:.75;stroke-width:34}
}

/* 樹木 */
.tree-top{transform-box:fill-box;transform-origin:bottom center;animation:treeSway 5s ease-in-out infinite}
.tree-top.second{animation-delay:-2.5s}
@keyframes treeSway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1.5deg)}}

/* 風車 */
.blades{
  transform-box:fill-box;
  transform-origin:center;
  animation:windmill 8s linear infinite;
}
@keyframes windmill{to{transform:rotate(360deg)}}

/* 農夫 */
.farmer-arm{transform-box:fill-box;transform-origin:top center;animation:wave 2s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(15deg)}}
.note{animation:noteFloat 2s ease-in-out infinite}
.note.two{animation-delay:-1s}
@keyframes noteFloat{0%,100%{opacity:.5;transform:translateY(5px)}50%{opacity:1;transform:translateY(-10px)}}

/* 動物：只做小幅度動作，不改變地面位置 */
.hen-head{transform-box:fill-box;transform-origin:bottom center;animation:henPeck 1.8s ease-in-out infinite}
@keyframes henPeck{
  0%,35%,100%{transform:rotate(0)}
  55%{transform:rotate(22deg)}
  72%{transform:rotate(5deg)}
}
.duck-body{animation:duckStep 1.2s ease-in-out infinite}
.duck-body.two{animation-delay:-.3s}
.duck-body.three{animation-delay:-.6s}
@keyframes duckStep{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.sheep-eye{animation:blink 4s infinite}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
.sheep-body{animation:sheepBounce 3s ease-in-out infinite}
.sheep-body.two{animation-delay:-1s}
.sheep-body.three{animation-delay:-2s}
@keyframes sheepBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.horse-ear{animation:earMove 3s ease-in-out infinite alternate}
@keyframes earMove{to{transform:rotate(5deg)}}
.snail{animation:snailMove 18s linear infinite alternate}
@keyframes snailMove{from{transform:translateX(0)}to{transform:translateX(45px)}}
.flower{transform-box:fill-box;transform-origin:bottom center;animation:flowerSway 3s ease-in-out infinite alternate}
@keyframes flowerSway{to{transform:rotate(7deg)}}
</style>
</head>
