<html lang="zh-Hant">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morandi Dream Farm｜完整療癒農場</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#E9E7DD;overflow:hidden}
.farm{width:100%;height:100vh;min-height:550px;overflow:hidden}
svg{width:100%;height:100%;display:block}
.sun{transform-box:fill-box;transform-origin:center;animation:sun 4s infinite ease-in-out}
@keyframes sun{50%{transform:scale(1.1);opacity:.8}}
.cloud{animation:cloud 38s linear infinite}
.cloud.c2{animation-duration:48s;animation-delay:-18s}
.cloud.c3{animation-duration:44s;animation-delay:-28s}
@keyframes cloud{from{transform:translateX(-250px)}to{transform:translateX(1700px)}}
.bird{animation:bird 18s linear infinite}
.bird.b2{animation-delay:-8s;animation-duration:23s}
.bird.b3{animation-delay:-14s;animation-duration:26s}
@keyframes bird{from{transform:translateX(-100px)}to{transform:translateX(1600px)}}
.bird-wing{transform-box:fill-box;transform-origin:center;animation:flap .35s infinite alternate}
@keyframes flap{to{transform:rotate(25deg)}}
.tree-crown{transform-box:fill-box;transform-origin:bottom center;animation:sway 4s infinite ease-in-out}
@keyframes sway{50%{transform:rotate(4deg)}}
.blades{transform-origin:0 0;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.note{animation:note 3s infinite ease-out}
.note.n2{animation-delay:1s}
.note.n3{animation-delay:2s}
@keyframes note{0%{opacity:0;transform:translateY(15px)}30%{opacity:1}100%{opacity:0;transform:translateY(-50px)}}
.farmer-arm{transform-box:fill-box;transform-origin:top center;animation:arm 2s infinite ease-in-out}
@keyframes arm{50%{transform:rotate(15deg)}}

/* 母雞 */
.hen-body{transform-box:fill-box;transform-origin:center bottom;animation:henbody 1.5s infinite}
@keyframes henbody{50%{transform:rotate(-2deg)}}
.hen-head{transform-box:fill-box;transform-origin:15% 85%;animation:peck 1.5s infinite}
@keyframes peck{
0%,35%,100%{transform:rotate(0)}
55%,75%{transform:rotate(43deg)}
}
.hen-wing{transform-box:fill-box;transform-origin:20% 50%;animation:henwing 1.5s infinite}
@keyframes henwing{50%{transform:rotate(-8deg)}}
.hen{animation:henwalk 5s infinite ease-in-out}
@keyframes henwalk{50%{transform:translateX(12px)}}

/* 鴨子 */
.duck-family{animation:duckwalk 9s infinite ease-in-out}
@keyframes duckwalk{50%{transform:translateX(-45px)}}
.duck-body{animation:bob .8s infinite ease-in-out}
.duck-child:nth-child(2) .duck-body{animation-delay:-.2s}
.duck-child:nth-child(3) .duck-body{animation-delay:-.4s}
@keyframes bob{50%{transform:translateY(-5px)}}
.duck-head{transform-box:fill-box;transform-origin:50% 80%;animation:head 1.2s infinite}
@keyframes head{50%{transform:rotate(5deg)}}
.duck-leg{transform-box:fill-box;transform-origin:50% 0;animation:step .45s infinite alternate}
.duck-leg.second{animation-delay:-.45s}
@keyframes step{to{transform:rotate(22deg)}}

/* 綿羊 */
.sheep-one,.sheep-two,.sheep-three{transform-box:fill-box;transform-origin:center bottom;animation:hop 2.8s infinite}
.sheep-two{animation-delay:.8s}
.sheep-three{animation-delay:1.6s}
@keyframes hop{0%,85%,100%{transform:translateY(0)}92%{transform:translateY(-7px)}}
.sheep-eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.sheep-two .sheep-eyes{animation-delay:1s}
.sheep-three .sheep-eyes{animation-delay:2s}
@keyframes blink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}

/* 馬 */
.horse-head{transform-box:fill-box;transform-origin:50% 100%;animation:horse 3s infinite}
@keyframes horse{50%{transform:rotate(-5deg)}}
.horse-ear{transform-box:fill-box;transform-origin:50% 100%;animation:ear 2s infinite}
@keyframes ear{50%{transform:rotate(12deg)}}
.horse-eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}

/* 花朵 */
.flower{transform-box:fill-box;transform-origin:50% 100%;animation:flower 2.5s infinite ease-in-out}
.flower:nth-child(even){animation-delay:-1s}
@keyframes flower{50%{transform:rotate(10deg)}}

/* 蝸牛：移動路徑在地面上 */
.snail{animation:snailmove 40s linear infinite}
@keyframes snailmove{from{transform:translateX(0)}to{transform:translateX(1000px)}}
.snail-body{animation:snailbob 2s infinite ease-in-out}
@keyframes snailbob{50%{transform:translateY(-2px)}}

@media(max-width:700px){
.farm{min-height:450px}
}
</style>
