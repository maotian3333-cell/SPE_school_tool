<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>莫蘭迪風格動態農場 (Morandi Farm)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #EAEBED;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .farm-container {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      box-shadow: 0 15px 35px rgba(100, 110, 120, 0.15);
      border-radius: 20px;
      overflow: hidden;
      background: #C4D7E0;
    }
    svg {
      width: 100%;
      height: 100%;
    }

    /* -----------------------------------
       CSS 動畫設定 (過渡平滑自然)
    ----------------------------------- */

    /* 太陽脈動光暈 */
    .sun-glow {
      animation: sunPulse 4s ease-in-out infinite alternate;
      transform-origin: 110px 90px;
    }
    @keyframes sunPulse {
      0% { transform: scale(0.95); opacity: 0.35; }
      100% { transform: scale(1.15); opacity: 0.6; }
    }

    /* 雲朵飄動 */
    .cloud-1 { animation: moveCloud 45s linear infinite; }
    .cloud-2 { animation: moveCloud 65s linear infinite; animation-delay: -25s; }
    @keyframes moveCloud {
      0% { transform: translateX(-150px); }
      100% { transform: translateX(1000px); }
    }

    /* 天空小鳥順暢飛翔 (修正方向) */
    .birds-group {
      animation: birdFly 22s linear infinite;
    }
    @keyframes birdFly {
      0% { transform: translateX(1000px); }
      100% { transform: translateX(-150px); }
    }
    .bird-wing {
      animation: wingFlap 0.8s ease-in-out infinite alternate;
      transform-origin: center;
    }
    @keyframes wingFlap {
      0% { transform: scaleY(1); }
      100% { transform: scaleY(-0.6); }
    }

    /* 風車葉片緩慢旋轉 */
    .windmill-blades {
      transform-origin: 780px 230px;
      animation: rotateBlades 16s linear infinite;
    }
    @keyframes rotateBlades {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 乳牛平緩邁步與腳步微動 */
    .cow-group {
      animation: cowWalk 24s ease-in-out infinite alternate;
    }
    @keyframes cowWalk {
      0% { transform: translateX(0); }
      100% { transform: translateX(60px); }
    }
    .cow-leg-1 { animation: legMove 1.2s ease-in-out infinite alternate; transform-origin: top center; }
    .cow-leg-2 { animation: legMove 1.2s ease-in-out infinite alternate-reverse; transform-origin: top center; }
    @keyframes legMove {
      0% { transform: rotate(-5deg); }
      100% { transform: rotate(5deg); }
    }

    /* 母雞與小雞柔和啄地 (放慢速度) */
    .chicken-peck {
      animation: gentlePeck 3.5s ease-in-out infinite;
      transform-origin: 15px 18px;
    }
    @keyframes gentlePeck {
      0%, 100%, 30%, 70% { transform: rotate(0deg); }
      45%, 55% { transform: rotate(18deg); }
    }
    .chicken-walk {
      animation: chickenPace 16s ease-in-out infinite alternate;
    }
    @keyframes chickenPace {
      0% { transform: translateX(0); }
      100% { transform: translateX(35px); }
    }

    /* 小花定點搖擺 (底端固定，不移動) */
    .flower-sway {
      animation: flowerSway 3s ease-in-out infinite alternate;
      transform-origin: bottom center;
    }
    @keyframes flowerSway {
      0% { transform: rotate(-6deg) skewX(-3deg); }
      100% { transform: rotate(6deg) skewX(3deg); }
    }

    /* 農夫揮手與唱歌音符 */
    .farmer-arm {
      animation: waveHand 2.5s ease-in-out infinite alternate;
      transform-origin: 393px 388px;
    }
    @keyframes waveHand {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-18deg); }
    }
    .note-1 { animation: floatNote 3s ease-out infinite; }
    .note-2 { animation: floatNote 3s ease-out infinite 1.5s; }
    @keyframes floatNote {
      0% { transform: translate(395px, 360px) scale(0.6); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translate(410px, 335px) scale(1); opacity: 0; }
    }

    /* 馬兒耳朵微動與馬廄 */
    .horse-ear {
      animation: earTwitch 4s ease-in-out infinite;
      transform-origin: 885px 332px;
    }
    @keyframes earTwitch {
      0%, 90%, 100% { transform: rotate(0deg); }
      93%, 97% { transform: rotate(-12deg); }
    }

    /* 綿羊呼吸微搖 */
    .sheep-sway {
      animation: sheepBreath 4s ease-in-out infinite alternate;
      transform-origin: center bottom;
    }
    @keyframes sheepBreath {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-2px) rotate(1.5deg); }
    }

    /* 前景小蝸牛慢速爬行 */
    .snail-crawl {
      animation: snailMove 40s linear infinite;
    }
    @keyframes snailMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(180px); }
    }
    .snail-tentacle {
      animation: tentacleWiggle 2.5s ease-in-out infinite alternate;
      transform-origin: bottom center;
    }
    @keyframes tentacleWiggle {
      0% { transform: rotate(-5deg); }
      100% { transform: rotate(5deg); }
    }
  </style>
</head>
<body>

  <div class="farm-container">
    <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">

      <!-- 1. 莫蘭迪天空與太陽 -->
      <rect width="960" height="540" fill="#C4D7E0"/>
      <!-- 太陽光暈與本體 -->
      <circle class="sun-glow" cx="110" cy="90" r="55" fill="#F8E5BB"/>
      <circle cx="110" cy="90" r="38" fill="#F3D5A3"/>

      <!-- 2. 雲朵與小鳥 -->
      <g class="cloud-1" opacity="0.85">
        <path d="M 0 70 Q 20 50 45 70 Q 70 50 95 70 Q 105 90 85 90 L 15 90 Q -10 90 0 70 Z" fill="#F4F6F7"/>
      </g>
      <g class="cloud-2" opacity="0.75">
        <path d="M 0 110 Q 25 85 55 110 Q 80 85 110 110 Q 125 130 100 130 L 15 130 Q -15 130 0 110 Z" fill="#F4F6F7"/>
      </g>

      <!-- 天空飛翔小鳥 (面向左側順暢左飛) -->
      <g class="birds-group" fill="none" stroke="#7A8B99" stroke-width="2.2" stroke-linecap="round">
        <!-- 鳥 1 -->
        <g transform="translate(0, 100)">
          <path class="bird-wing" d="M 0 0 Q -8 -10 -16 -2 M 0 0 Q 8 -10 16 -2"/>
        </g>
        <!-- 鳥 2 -->
        <g transform="translate(35, 18)">
          <path class="bird-wing" d="M 0 0 Q -6 -8 -12 -1 M 0 0 Q 6 -8 12 -1"/>
        </g>
        <!-- 鳥 3 -->
        <g transform="translate(20, -22)">
          <path class="bird-wing" d="M 0 0 Q -5 -7 -10 -1 M 0 0 Q 5 -7 10 -1"/>
        </g>
      </g>

      <!-- 3. 遠景莫蘭迪山丘 -->
      <path d="M -50 340 Q 200 230 450 330 T 1000 300 L 1000 540 L -50 540 Z" fill="#A8C3B8"/>
      <path d="M 300 330 Q 580 210 1000 320 L 1000 540 L 300 540 Z" fill="#90B2A3"/>

      <!-- 4. 靜止紮根的樹木 (不移動) -->
      <!-- 左遠景樹 -->
      <g transform="translate(90, 275)">
        <rect x="14" y="40" width="8" height="25" fill="#8C7A6B" rx="2"/>
        <circle cx="18" cy="30" r="22" fill="#6B8E7B"/>
        <circle cx="6" cy="35" r="14" fill="#7A9A87"/>
        <circle cx="30" cy="35" r="14" fill="#7A9A87"/>
      </g>
      <!-- 中遠景小樹 -->
      <g transform="translate(480, 290)">
        <rect x="8" y="30" width="6" height="20" fill="#8C7A6B" rx="2"/>
        <polygon points="11,5 -3,35 25,35" fill="#7A9A87"/>
        <polygon points="11,-3 1,22 21,22" fill="#8EAC9B"/>
      </g>

      <!-- 5. 農舍與風車 -->
      <!-- 紅色主穀倉 -->
      <g id="barn" transform="translate(620, 230)">
        <rect x="0" y="35" width="85" height="55" fill="#C87D75"/>
        <polygon points="-5,35 42.5,5 90,35" fill="#5B6B7C"/>
        <polygon points="4,35 42.5,12 81,35" fill="#F4F6F7"/>
        <!-- 門板與白框 -->
        <rect x="28" y="52" width="28" height="38" fill="#F4F6F7"/>
        <rect x="31" y="55" width="22" height="35" fill="#B66A62"/>
        <line x1="31" y1="55" x2="53" y2="90" stroke="#F4F6F7" stroke-width="1.5"/>
        <line x1="53" y1="55" x2="31" y2="90" stroke="#F4F6F7" stroke-width="1.5"/>
      </g>

      <!-- 風車塔 -->
      <g id="windmill">
        <polygon points="768,310 792,310 787,230 773,230" fill="#E2C29F"/>
        <polygon points="770,230 790,230 780,218" fill="#C87D75"/>
        <circle cx="780" cy="230" r="4.5" fill="#4A5568"/>
        <!-- 風車扇葉 (動畫) -->
        <g class="windmill-blades">
          <path d="M 780 230 L 774 165 L 786 165 Z" fill="#F4F6F7"/>
          <path d="M 780 230 L 845 224 L 845 236 Z" fill="#F4F6F7"/>
          <path d="M 780 230 L 786 295 L 774 295 Z" fill="#F4F6F7"/>
          <path d="M 780 230 L 715 236 L 715 224 Z" fill="#F4F6F7"/>
          <circle cx="780" cy="230" r="3.5" fill="#C87D75"/>
        </g>
      </g>

      <!-- 馬廄與探出頭的馬匹 -->
      <g id="stable-and-horse" transform="translate(840, 310)">
        <!-- 馬廄木屋 -->
        <rect x="0" y="20" width="85" height="60" fill="#B8977E"/>
        <polygon points="-5,20 42.5,0 90,20" fill="#7A6B5D"/>
        <!-- 馬廄窗門框 -->
        <rect x="15" y="32" width="55" height="48" fill="#5D4E43"/>
        <rect x="15" y="55" width="55" height="25" fill="#9E7E66"/> <!-- 下方圍欄 -->

        <!-- 馬匹 (探出頭來) -->
        <g id="horse-head" transform="translate(25, 25)">
          <!-- 馬脖子 -->
          <path d="M 10 32 C 12 18, 20 12, 28 10 L 35 25 L 32 32 Z" fill="#A47149"/>
          <!-- 馬鬃毛 -->
          <path d="M 24 8 C 22 15, 26 22, 28 28" stroke="#5C3A21" stroke-width="4" stroke-linecap="round" fill="none"/>
          <!-- 馬臉部 -->
          <ellipse cx="16" cy="16" rx="14" ry="9" fill="#A47149" transform="rotate(-20 16 16)"/>
          <ellipse cx="8" cy="19" rx="6" ry="5" fill="#BD8B63" transform="rotate(-20 8 19)"/> <!-- 鼻吻 -->
          <circle cx="7" cy="18" r="1" fill="#333"/> <!-- 鼻孔 -->
          <circle cx="18" cy="12" r="1.8" fill="#222"/> <!-- 眼睛 -->
          <!-- 馬耳朵 (微動) -->
          <polygon class="horse-ear" points="24,6 29,0 27,9" fill="#A47149"/>
        </g>
      </g>

      <!-- 6. 中景地形與農田 -->
      <path d="M -20 380 Q 280 310 580 390 T 1000 350 L 1000 540 L -20 540 Z" fill="#7E9F8E"/>
      <path d="M -10 430 Q 300 370 650 440 T 1000 410 L 1000 540 L -10 540 Z" fill="#6B8E7B"/>

      <!-- 7. 農夫 (手臂連接完善、歌唱音符) -->
      <g id="farmer-group" transform="translate(360, 360)">
        <!-- 腿與腳 -->
        <rect x="16" y="52" width="6" height="22" fill="#5B6B7C"/>
        <rect x="26" y="52" width="6" height="22" fill="#5B6B7C"/>
        <ellipse cx="18" cy="74" rx="5" ry="2.5" fill="#4A3B32"/>
        <ellipse cx="28" cy="74" rx="5" ry="2.5" fill="#4A3B32"/>
        <!-- 身體/工作褲 -->
        <rect x="13" y="28" width="22" height="26" rx="4" fill="#6C8299"/>
        <rect x="16" y="20" width="16" height="12" fill="#D98A6C"/> <!-- 內襯襯衫 -->
        <!-- 左臂 (自然垂放) -->
        <path d="M 13 22 Q 6 32 8 42" stroke="#D98A6C" stroke-width="5" stroke-linecap="round" fill="none"/>
        <!-- 右臂 (完美連接身體並動態揮手) -->
        <path class="farmer-arm" d="M 33 22 Q 43 18 45 6" stroke="#D98A6C" stroke-width="5" stroke-linecap="round" fill="none"/>
        <!-- 農夫頭部 -->
        <circle cx="24" cy="12" r="8" fill="#F3C5A5"/>
        <path d="M 18 13 Q 24 18 30 13" stroke="#9E6B4D" stroke-width="1.5" fill="none"/> <!-- 笑臉嘴巴 -->
        <circle cx="21" cy="10" r="1" fill="#333"/>
        <circle cx="27" cy="10" r="1" fill="#333"/>
        <!-- 草帽 -->
        <ellipse cx="24" cy="6" rx="14" ry="4" fill="#E0C391"/>
        <path d="M 16 6 C 16 0, 32 0, 32 6 Z" fill="#CBA667"/>
      </g>
      <!-- 歌唱音符 -->
      <text class="note-1" fill="#5B6B7C" font-size="16" font-weight="bold">♬</text>
      <text class="note-2" fill="#6C8299" font-size="14" font-weight="bold">♪</text>

      <!-- 8. 動物角色 (乳牛、莫蘭迪綿羊、母雞與小雞) -->

      <!-- [乳牛] (自然踱步與腳步微動) -->
      <g class="cow-group">
        <g id="cow" transform="translate(140, 395)">
          <!-- 後腳與前腳 -->
          <rect class="cow-leg-1" x="12" y="32" width="5" height="18" fill="#5A6572" rx="2"/>
          <rect class="cow-leg-2" x="24" y="32" width="5" height="18" fill="#5A6572" rx="2"/>
          <rect class="cow-leg-2" x="44" y="32" width="5" height="18" fill="#5A6572" rx="2"/>
          <rect class="cow-leg-1" x="56" y="32" width="5" height="18" fill="#5A6572" rx="2"/>
          <!-- 軀幹 -->
          <rect x="8" y="10" width="58" height="26" rx="10" fill="#F4F6F7"/>
          <!-- 莫蘭迪灰黑斑塊 -->
          <path d="M 22 10 Q 30 22 40 10 Z" fill="#6C7A89"/>
          <circle cx="54" cy="23" r="6" fill="#6C7A89"/>
          <!-- 尾巴 -->
          <path d="M 65 15 Q 72 20 70 28" stroke="#6C7A89" stroke-width="2" fill="none"/>
          <!-- 頭部與牛角 -->
          <rect x="0" y="6" width="15" height="18" rx="4" fill="#F4F6F7"/>
          <rect x="-3" y="15" width="11" height="9" rx="3" fill="#E8B4B8"/> <!-- 粉柔鼻子 -->
          <circle cx="4" cy="11" r="1.5" fill="#333"/>
          <path d="M 8 5 Q 4 -2 0 4" stroke="#D0B58B" stroke-width="2" fill="none"/>
        </g>
      </g>

      <!-- [莫蘭迪絨毛綿羊家族] (精緻圓滾造型) -->
      <g id="sheep-family" transform="translate(480, 415)">
        <!-- 大羊 -->
        <g class="sheep-sway" transform="translate(0, 0)">
          <rect x="10" y="24" width="4" height="14" fill="#6B5B52" rx="1.5"/>
          <rect x="28" y="24" width="4" height="14" fill="#6B5B52" rx="1.5"/>
          <!-- 蓬鬆身體 -->
          <circle cx="12" cy="14" r="11" fill="#EAE6E1"/>
          <circle cx="22" cy="10" r="13" fill="#EAE6E1"/>
          <circle cx="32" cy="15" r="10" fill="#EAE6E1"/>
          <circle cx="20" cy="18" r="11" fill="#EAE6E1"/>
          <!-- 臉部 -->
          <ellipse cx="4" cy="14" rx="6" ry="4.5" fill="#6B5B52"/>
          <circle cx="3" cy="13" r="0.8" fill="#FFF"/>
          <ellipse cx="7" cy="10" rx="3" ry="1.5" fill="#54463D" transform="rotate(-30 7 10)"/>
        </g>
        <!-- 小羊 -->
        <g class="sheep-sway" transform="translate(42, 8) scale(0.65)">
          <rect x="10" y="24" width="4" height="14" fill="#6B5B52" rx="1.5"/>
          <rect x="28" y="24" width="4" height="14" fill="#6B5B52" rx="1.5"/>
          <circle cx="12" cy="14" r="11" fill="#F0ECE6"/>
          <circle cx="22" cy="10" r="13" fill="#F0ECE6"/>
          <circle cx="32" cy="15" r="10" fill="#F0ECE6"/>
          <ellipse cx="4" cy="14" rx="6" ry="4.5" fill="#6B5B52"/>
          <circle cx="3" cy="13" r="0.8" fill="#FFF"/>
        </g>
      </g>

      <!-- [母雞與小雞群] (過渡平緩啄地、走動) -->
      <g class="chicken-walk" transform="translate(260, 440)">
        <!-- 母雞媽媽 -->
        <g transform="translate(0, 0)">
          <line x1="14" y1="22" x2="12" y2="30" stroke="#D99B6A" stroke-width="2"/>
          <line x1="18" y1="22" x2="20" y2="30" stroke="#D99B6A" stroke-width="2"/>
          <!-- 身體尾羽一體化 -->
          <path d="M 6 14 Q 4 24 16 22 Q 25 20 23 12 Q 16 10 6 14 Z" fill="#D99B6A"/>
          <path d="M 21 13 L 27 7 L 26 16 Z" fill="#C87D75"/>
          <!-- 啄地頭部 -->
          <g class="chicken-peck">
            <circle cx="6" cy="12" r="5" fill="#D99B6A"/>
            <polygon points="2,12 -3,14 2,16" fill="#C87D75"/> <!-- 雞嘴 -->
            <polygon points="6,7 4,3 8,5" fill="#B66A62"/> <!-- 雞冠 -->
            <circle cx="5" cy="11" r="0.8" fill="#333"/>
          </g>
        </g>
        <!-- 小雞 1 -->
        <g class="chicken-peck" transform="translate(32, 10) scale(0.55)">
          <ellipse cx="10" cy="10" rx="7" ry="6" fill="#F3D5A3"/>
          <polygon points="3,10 0,11 3,13" fill="#D99B6A"/>
          <circle cx="7" cy="9" r="1" fill="#333"/>
          <line x1="10" y1="16" x2="10" y2="21" stroke="#D99B6A" stroke-width="2"/>
        </g>
        <!-- 小雞 2 -->
        <g class="chicken-peck" transform="translate(45, 12) scale(0.5)" style="animation-delay: 0.6s;">
          <ellipse cx="10" cy="10" rx="7" ry="6" fill="#F3D5A3"/>
          <polygon points="3,10 0,11 3,13" fill="#D99B6A"/>
          <circle cx="7" cy="9" r="1" fill="#333"/>
          <line x1="10" y1="16" x2="10" y2="21" stroke="#D99B6A" stroke-width="2"/>
        </g>
        <!-- 小雞 3 -->
        <g transform="translate(56, 14) scale(0.48)">
          <ellipse cx="10" cy="10" rx="7" ry="6" fill="#F3D5A3"/>
          <polygon points="3,10 0,11 3,13" fill="#D99B6A"/>
          <circle cx="7" cy="9" r="1" fill="#333"/>
          <line x1="10" y1="16" x2="10" y2="21" stroke="#D99B6A" stroke-width="2"/>
        </g>
      </g>

      <!-- 9. 前景白色木柵欄與定點搖擺小花 -->
      <g id="fence-
