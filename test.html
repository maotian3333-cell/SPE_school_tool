
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>莫蘭迪色系 Q 版動畫農場</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dce8e5}
svg{width:100vw;height:100vh;display:block}

.cloud{animation:cloudMove 28s ease-in-out infinite alternate}
.cloud.c2{animation-delay:-13s}
@keyframes cloudMove{to{transform:translateX(28px)}}

.sun-glow{transform-box:fill-box;transform-origin:center;animation:sunPulse 4s infinite}
@keyframes sunPulse{50%{opacity:.55;transform:scale(1.12)}}

.rainbow-glow{fill:none;stroke:#fff7dc;stroke-width:26;opacity:.2;filter:url(#glow);animation:rainbowGlow 3s infinite}
@keyframes rainbowGlow{50%{opacity:.7;stroke-width:34}}

.bird{animation:birdFly 8s ease-in-out infinite alternate}
@keyframes birdFly{to{transform:translate(25px,-12px)}}

.tree-crown{transform-box:fill-box;transform-origin:bottom center;animation:treeSway 5s ease-in-out infinite alternate}
@keyframes treeSway{to{transform:rotate(1.5deg)}}

.blades{transform-box:fill-box;transform-origin:center;animation:windmill 9s linear infinite}
@keyframes windmill{to{transform:rotate(360deg)}}

.farmer-wave{
  transform-box:view-box;
  transform-origin:765px 575px;
  animation:wave 2.5s ease-in-out infinite alternate;
}
@keyframes wave{from{transform:rotate(-7deg)}to{transform:rotate(9deg)}}

.note{animation:noteFloat 2s ease-in-out infinite}
.note.n2{animation-delay:-1s}
@keyframes noteFloat{50%{transform:translateY(-9px);opacity:1}}

.hen-head{transform-box:fill-box;transform-origin:bottom center;animation:peck 2s ease-in-out infinite}
@keyframes peck{0%,35%,100%{transform:rotate(0)}55%{transform:rotate(18deg)}70%{transform:rotate(3deg)}}

.duck-body{animation:duckStep 1.4s ease-in-out infinite}
.duck-body.d2{animation-delay:-.4s}
.duck-body.d3{animation-delay:-.8s}
@keyframes duckStep{50%{transform:translateY(-2px)}}

.sheep{animation:sheepMove 3.5s ease-in-out infinite}
.sheep.s2{animation-delay:-1.2s}
.sheep.s3{animation-delay:-2.4s}
@keyframes sheepMove{50%{transform:translateY(-2px)}}

.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.12)}}

.flower-head{
  transform-box:view-box;
  transform-origin:0 0;
  animation:flowerSway 3.5s ease-in-out infinite alternate;
}
@keyframes flowerSway{to{transform:rotate(5deg)}}

.snail{animation:snailMove 22s ease-in-out infinite alternate}
@keyframes snailMove{to{transform:translateX(28px)}}
</style>
</head>
